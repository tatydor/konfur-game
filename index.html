<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#132F5A">
  <title>Пилот за пять шагов</title>
  <link rel="preload" href="fonts/tektur-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
  <script>
    // ── Единственное место с версией сборки ───────────────────────────────
    // Меняем ТОЛЬКО это число при релизе и держим равным GAME_VERSION в data.js.
    // Версия дописывается ко всем модулям и стилям как ?v=…, поэтому браузер
    // берёт свежие файлы сразу после деплоя, не дожидаясь истечения кеша
    // (GitHub Pages отдаёт их с max-age=600, то есть до 10 минут старую копию).
    // Шрифты (.woff2) не версионируем — они не меняются и весят много.
    (function () {
      var V = "0.9.31";
      window.__BUILD_V = V;
      var head = document.head;
      function link(href) {
        var e = document.createElement("link");
        e.rel = "stylesheet"; e.href = href; head.appendChild(e);
      }
      link("fonts/fonts.css?v=" + V);
      link("styles.css?v=" + V);
      // Карта импортов: относительные модули отдаются с версией. Ключ и импорт
      // резолвятся в один абсолютный адрес, поэтому подхватываются и вложенные
      // импорты (screens.js → data.js и т.д.) — сам код менять не нужно.
      var mods = ["app.js", "data.js", "screens.js", "storage.js", "dom.js", "intro.js", "intro-assets.js", "task-icons.js", "test-scene.js"];
      var imports = {};
      mods.forEach(function (m) { imports["./" + m] = "./" + m + "?v=" + V; });
      var im = document.createElement("script");
      im.type = "importmap";
      im.textContent = JSON.stringify({ imports: imports });
      head.appendChild(im);
      // Точка входа с версией; её импорты подхватывают карту выше.
      var entry = document.createElement("script");
      entry.type = "module"; entry.src = "app.js?v=" + V;
      head.appendChild(entry);
    })();
  </script>
</head>
<body>
  <main id="app">
    <noscript>Для игры нужен включённый JavaScript.</noscript>
  </main>
</body>
</html>
